name: RMIT Job Monitor

on:
  schedule:
    # Run every 2 hours (at 14 minutes past the hour to avoid GitHub Actions queue delays)
    - cron: '14 */2 * * *'
  workflow_dispatch:
    inputs:
      send_test_email:
        description: 'Send a test email with a mock job posting'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download jobs database
        uses: actions/cache/restore@v5
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jobs-db-

      - name: Run job monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
        run: |
          if [ "${{ inputs.send_test_email }}" = "true" ]; then
            python monitor.py --test
          else
            python monitor.py
          fi

      - name: Save jobs database
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}-${{ github.run_attempt }}
